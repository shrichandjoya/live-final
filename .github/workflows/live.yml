name: 24/7 Free Live Stream Uploaded Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Start 24/7 Live Stream Loop
      run: |
        while true; do
          ffmpeg -re -loop 1 -i background.jpg.jpg -i music.mp3.mp3 -c:v libx264 -preset ultrafast -b:v 1500k -maxrate 1500k -bufsize 3000k -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://://youtube.com{{ secrets.YOUTUBE_KEY }}"
          sleep 2
        done
